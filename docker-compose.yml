services:
  mysql:
    image: mysql:8.4
    container_name: elegance-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elegance_dev}
      MYSQL_USER: ${MYSQL_USER:-elegance_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elegance_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-elegance_root_dev_only}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-elegance_root_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:

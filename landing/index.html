<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Empress.pk | Launching Soon</title>
<meta name="description" content="Empress.pk is launching soon. Fine jewellery, elegantly reimagined." />
<meta property="og:title" content="Empress.pk | Launching Soon" />
<meta property="og:description" content="Empress.pk is launching soon. Fine jewellery, elegantly reimagined." />
<meta property="og:image" content="images/hero-landscape.webp" />
<meta property="og:type" content="website" />
<style>
  :root {
    color-scheme: dark;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
      120deg,
      #190a24,
      #2a0f3d,
      #170a28,
      #1c0d33
    );
    background-size: 300% 300%;
    animation: drift 22s ease-in-out infinite;
  }

  /* Layer 2: floating glowing orbs - gold, pink, blue */
  body::before {
    content: "";
    position: absolute;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 200, 90, 0.35) 0%, rgba(255, 200, 90, 0) 60%),
      radial-gradient(circle at 80% 20%, rgba(255, 110, 180, 0.3) 0%, rgba(255, 110, 180, 0) 55%),
      radial-gradient(circle at 70% 75%, rgba(90, 140, 255, 0.3) 0%, rgba(90, 140, 255, 0) 55%),
      radial-gradient(circle at 30% 80%, rgba(210, 140, 255, 0.25) 0%, rgba(210, 140, 255, 0) 60%);
    animation: floatOrbs 16s ease-in-out infinite;
  }

  /* Layer 3: diagonal white shimmer sweep */
  body::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -150%;
    width: 120%;
    height: 200%;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(
      75deg,
      rgba(255, 255, 255, 0) 45%,
      rgba(255, 255, 255, 0.12) 50%,
      rgba(255, 255, 255, 0) 55%
    );
    animation: shimmerSweep 6s linear infinite;
  }

  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes floatOrbs {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(3%, -4%) scale(1.08); }
    66%  { transform: translate(-3%, 3%) scale(0.95); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes shimmerSweep {
    0%   { transform: translateX(0) rotate(0deg); }
    100% { transform: translateX(170%) rotate(0deg); }
  }

  .hero {
    position: relative;
    z-index: 1;
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    body,
    body::before,
    body::after {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <picture class="hero">
    <source media="(max-width: 1099px)" srcset="images/hero-portrait.webp" />
    <source media="(min-width: 1100px)" srcset="images/hero-landscape.webp" />
    <img src="images/hero-landscape.webp" alt="" />
  </picture>
</body>
</html>
